{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card border-danger shadow-sm"><div class="card-body p-4">
    <h1 class="h5">Potwierdź usunięcie</h1>
    <p>Czy na pewno usunąć <strong>{{ object }}</strong>?{% if object.cards %} Usunięte zostaną też wszystkie karty tej talii i postęp nauki.{% endif %}</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger"><i class="bi bi-trash"></i> Tak, usuń</button>
      <a href="javascript:history.back()" class="btn btn-secondary">Anuluj</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
