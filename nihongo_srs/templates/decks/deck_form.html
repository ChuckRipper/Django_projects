{% extends 'base.html' %}
{% block title %}{% if object %}Edycja talii{% else %}Nowa talia{% endif %} – Nihongo SRS{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">{% if object %}Edycja talii{% else %}Nowa talia{% endif %}</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include '_form.html' %}
      <button class="btn btn-primary">Zapisz</button>
      <a href="{% if object %}{% url 'deck_detail' object.pk %}{% else %}{% url 'deck_list' %}{% endif %}" class="btn btn-secondary">Anuluj</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
