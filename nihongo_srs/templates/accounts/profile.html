{% extends 'base.html' %}
{% block title %}Profil – Nihongo SRS{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-1">Ustawienia nauki</h1>
    <p class="text-body-secondary small mb-3">{{ user.username }} · {{ user.email }}</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include '_form.html' %}
      <button class="btn btn-primary">Zapisz</button>
    </form>
    <hr>
    <a href="{% url 'password_change' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-key"></i> Zmień hasło</a>
  </div></div>
</div></div>
{% endblock %}
