{% extends 'registration/_auth_card.html' %}
{% block title %}Zmiana hasła – Nihongo SRS{% endblock %}
{% block card %}
<h1 class="h4 mb-3">Zmiana hasła</h1>
<form method="post" novalidate>

</form>
{% endblock %}
